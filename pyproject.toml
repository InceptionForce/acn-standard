[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "acn-standard"
# Single-sourced from acn_standard.__version__ so a release cannot ship a
# package whose metadata and library disagree about what it is.
dynamic = ["version"]
description = "Reference contracts and conformance tools for Agent Commerce Network"
requires-python = ">=3.11"
license = "Apache-2.0"
# 50.0.0 is the floor that clears PYSEC-2026-3552; the earlier advisories in
# this chain are fixed at 46.0.5 through 49.0.0, so anything below 50 leaves at
# least one open. It is also what workforce already pins, so the monorepo and
# the published package agree.
dependencies = ["cryptography>=50,<51"]

[project.scripts]
acn-conformance = "acn_standard.cli:main"

[tool.setuptools.dynamic]
version = {attr = "acn_standard.__version__"}

# The Python project lives under py/ now that the npm SDK shares this
# repository, so setuptools has to be told where the package actually is.
[tool.setuptools]
package-dir = {"" = "py/src"}

# The conformance corpus travels with the library. It is the reference
# definition of a well-formed envelope, so anyone implementing an agent — or a
# service verifying one — needs it as much as they need the code, and a corpus
# fetched separately is a corpus that drifts.
[project.optional-dependencies]
# Validating the corpus against the JSON Schemas, which is how the schemas and
# the Python validator are kept from drifting apart. Not needed at runtime —
# the library validates in Python.
test = ["jsonschema>=4.23,<5"]

[tool.setuptools.package-data]
acn_standard = [
    "conformance/valid/*.json",
    "conformance/invalid/*.json",
    "schemas/*.json",
    "schemas/*/*.json",
]

[tool.setuptools.packages.find]
where = ["py/src"]

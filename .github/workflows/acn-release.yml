name: ACN Release

# Publishing the SDKs, which is separate from ACN CI on purpose: CI proves a
# change is good, this puts a version in front of the public and cannot be
# taken back. A release is therefore driven by a tag rather than by a merge.
#
# Tags:
#   acn-standard-v0.1.0   publishes the Python package to PyPI
#   acn-sdk-ts-v0.1.0     publishes the TypeScript SDK to npm
#
# Both SDKs implement the same canonicalization, and a signature made by one
# has to verify under the other. Releasing them from one workflow keeps that
# pairing visible; releasing a matching pair of versions is a judgement the
# person cutting the tag still has to make.

on:
  push:
    tags: ["acn-standard-v*", "acn-sdk-ts-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish a release candidate to the test registries"
        required: true
        type: choice
        options: [test-pypi, npm-dry-run]

permissions:
  contents: read

concurrency:
  group: acn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    if: startsWith(github.ref, 'refs/tags/acn-standard-v') || github.event.inputs.target == 'test-pypi'
    runs-on: ubuntu-latest
    environment: acn-release
    permissions:
      contents: read
      # Trusted Publishing: PyPI verifies this workflow's identity directly, so
      # there is no long-lived upload token to leak or rotate.
      id-token: write
    defaults:
      run:
        working-directory: apps/ai_engine/acn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -e ./acn-standard build twine

      - name: The tag has to name the version being published
        if: startsWith(github.ref, 'refs/tags/acn-standard-v')
        run: |
          declared=$(python -c "import acn_standard; print(acn_standard.__version__)")
          tagged="${GITHUB_REF_NAME#acn-standard-v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match acn_standard.__version__ ($declared)"
            exit 1
          fi
          echo "publishing acn-standard $declared"

      # A published version is permanent, so the suite runs here too rather
      # than trusting that CI ran on whatever this tag points at.
      - run: python -m unittest discover -s acn-standard/tests -v

      - run: python -m build acn-standard
      - name: The distribution has to be well formed
        run: twine check acn-standard/dist/*

      - name: Nothing but the library may be installed
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("acn-standard/dist/*.whl")[0]
          top = {name.split("/")[0] for name in zipfile.ZipFile(wheel).namelist()}
          stray = {item for item in top if not item.endswith(".dist-info")} - {"acn_standard"}
          assert not stray, f"the wheel would install {stray} into site-packages"
          print("wheel installs only acn_standard")
          PY

      - name: Build the specification archive and SBOM
        run: |
          python acn-standard/tools/build_release.py
          python acn-standard/tools/generate_sbom.py

      - uses: actions/upload-artifact@v4
        with:
          name: acn-standard-dist
          path: apps/ai_engine/acn/acn-standard/dist/*

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'test-pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: apps/ai_engine/acn/acn-standard/dist
          repository-url: https://test.pypi.org/legacy/
          # The archive and SBOM sit alongside the distributions.
          verbose: true
          skip-existing: true

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/acn-standard-v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: apps/ai_engine/acn/acn-standard/dist

  typescript:
    if: startsWith(github.ref, 'refs/tags/acn-sdk-ts-v') || github.event.inputs.target == 'npm-dry-run'
    runs-on: ubuntu-latest
    environment: acn-release
    permissions:
      contents: read
      # npm records where a package was built, so consumers can check it came
      # from this repository rather than from someone's laptop.
      id-token: write
    defaults:
      run:
        working-directory: apps/ai_engine/acn/acn-sdk-typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: apps/ai_engine/acn/acn-sdk-typescript/package-lock.json

      - name: The tag has to name the version being published
        if: startsWith(github.ref, 'refs/tags/acn-sdk-ts-v')
        run: |
          declared=$(node -p "require('./package.json').version")
          tagged="${GITHUB_REF_NAME#acn-sdk-ts-v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($declared)"
            exit 1
          fi
          echo "publishing @agent-commerce-network/sdk $declared"

      - run: npm ci
      - run: npm test

      - name: The package has to contain the built output
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node - <<'JS'
          const pack = require('/tmp/pack.json')[0];
          const files = pack.files.map((file) => file.path);
          const missing = ['dist/index.js', 'dist/index.d.ts'].filter(
            (name) => !files.includes(name),
          );
          if (missing.length) {
            console.error(`::error::the package is missing ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`${pack.name} ${pack.version} carries ${files.length} files`);
          JS

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/acn-sdk-ts-v')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
